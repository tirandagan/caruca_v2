[project]
name = "caruca-v2"
version = "0.1.0"
description = "LLM replication of caruca's specification-mining pipeline, built for measurement against the v1 baseline."
requires-python = ">=3.12"
dependencies = [
    "openai>=1.51",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "rich>=13.9",
]

[project.scripts]
caruca-v2 = "caruca_v2.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caruca_v2"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
