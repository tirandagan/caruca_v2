<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--text-body);background:#fff}a{color:var(--blue)}a:hover{color:var(--blue-hover)}.row{display:flex;gap:12px}.sw{flex:1;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;height:80px}.nm{font-size:12px;font-weight:600}.hx{font-family:var(--font-mono);font-size:11px;opacity:.75}.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500);font-weight:600;margin-bottom:2px}</style></head><body>
<div style="display:flex;gap:28px;align-items:center">
<div style="flex:1">
<div style="width:80px;height:4px;background:linear-gradient(to right,#0E7490,#0B1F33);border-radius:2px"></div>
<div style="font-size:12px;color:var(--gray-500);margin-top:8px">Accent bar 80×4, teal→ink, under titles</div>
<div style="width:120px;border-top:1px solid transparent;height:1px;background:linear-gradient(to right,transparent,#D1D5DB,transparent);margin-top:20px"></div>
<div style="font-size:12px;color:var(--gray-500);margin-top:8px">Faded-edge horizontal rule</div>
</div>
<div style="width:240px;height:150px;position:relative;overflow:hidden;border:1px solid #E5E7EB;border-radius:6px">
<div style="position:absolute;top:-130px;right:-130px;width:260px;height:260px;border-radius:50%;border:24px solid rgba(14,116,144,.06);box-shadow:0 0 0 48px rgba(14,116,144,.045),0 0 0 72px rgba(14,116,144,.03),0 0 0 96px rgba(14,116,144,.015)"></div>
<div style="position:absolute;bottom:10px;left:12px;font-size:12px;color:var(--gray-500)">Concentric rings bleed off a corner</div>
</div></div></body></html>
