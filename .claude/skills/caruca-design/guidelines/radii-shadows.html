<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--text-body);background:#fff}a{color:var(--blue)}a:hover{color:var(--blue-hover)}.row{display:flex;gap:12px}.sw{flex:1;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;height:80px}.nm{font-size:12px;font-weight:600}.hx{font-family:var(--font-mono);font-size:11px;opacity:.75}.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500);font-weight:600;margin-bottom:2px}</style></head><body>
<div style="display:flex;gap:16px;align-items:center">
<div style="width:88px;height:64px;border:1px solid #D0D7DE;border-radius:3px;display:grid;place-items:center" class="hx">3 ticks</div>
<div style="width:88px;height:64px;border:1px solid #D0D7DE;border-radius:4px;display:grid;place-items:center" class="hx">4 chips</div>
<div style="width:88px;height:64px;border:1px solid #D0D7DE;border-radius:6px;display:grid;place-items:center" class="hx">6 blocks</div>
<div style="width:88px;height:64px;border:1px solid #E2E8F0;border-radius:6px;box-shadow:0 8px 24px rgba(11,31,51,.12);display:grid;place-items:center" class="hx">overlay</div>
<div style="height:32px;padding:0 14px;border:1px solid #D0D7DE;border-radius:999px;display:grid;place-items:center" class="hx">pill badges</div>
</div></body></html>
