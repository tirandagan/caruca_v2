<!-- @dsCard group="Colors" viewport="700x160" name="Surfaces & borders" subtitle="Gray marks code and table heads; hairlines separate" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--text-body);background:#fff}a{color:var(--blue)}a:hover{color:var(--blue-hover)}.row{display:flex;gap:12px}.sw{flex:1;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;height:80px}.nm{font-size:12px;font-weight:600}.hx{font-family:var(--font-mono);font-size:11px;opacity:.75}.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500);font-weight:600;margin-bottom:2px}</style></head><body>
<div class="row">
<div class="sw" style="background:#F6F8FA;border:1px solid #D0D7DE;height:64px"><span class="nm">Code</span><span class="hx">#F6F8FA</span></div>
<div class="sw" style="background:#EFF1F3;height:64px"><span class="nm">Inline code</span><span class="hx">#EFF1F3</span></div>
<div class="sw" style="background:#F1F5F9;height:64px"><span class="nm">Table head</span><span class="hx">#F1F5F9</span></div>
<div class="sw" style="background:#F8FAFC;border:1px solid #E2E8F0;height:64px"><span class="nm">Zebra row</span><span class="hx">#F8FAFC</span></div>
</div>
<div style="display:flex;gap:24px;margin-top:14px;font-size:11px;color:var(--gray-500)">
<div style="flex:1"><div style="border-top:1px solid #D0D7DE;margin-bottom:4px"></div>strong #D0D7DE</div>
<div style="flex:1"><div style="border-top:1px solid #E2E8F0;margin-bottom:4px"></div>default #E2E8F0</div>
<div style="flex:1"><div style="border-top:1px solid #E5E7EB;margin-bottom:4px"></div>subtle #E5E7EB</div>
<div style="flex:1"><div style="border-top:2px solid #334155;margin-bottom:4px"></div>table-head rule #334155</div>
</div></body></html>
