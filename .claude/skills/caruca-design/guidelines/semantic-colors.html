<!-- @dsCard group="Colors" viewport="700x170" name="Semantic colors" subtitle="Status only — never decorative" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--text-body);background:#fff}a{color:var(--blue)}a:hover{color:var(--blue-hover)}.row{display:flex;gap:12px}.sw{flex:1;border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;height:80px}.nm{font-size:12px;font-weight:600}.hx{font-family:var(--font-mono);font-size:11px;opacity:.75}.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--gray-500);font-weight:600;margin-bottom:2px}</style></head><body>
<div class="row">
<div style="flex:1;border-left:4px solid #16A34A;background:#ECFDF5;border-radius:0 6px 6px 0;padding:12px"><div class="lbl" style="color:#15803D">Success</div><span class="hx">#16A34A / #15803D / #ECFDF5</span></div>
<div style="flex:1;border-left:4px solid #E6A817;background:#FFFBEB;border-radius:0 6px 6px 0;padding:12px"><div class="lbl" style="color:#B8860B">Warning</div><span class="hx">#E6A817 / #B8860B / #FFFBEB</span></div>
<div style="flex:1;border-left:4px solid #DF2E2E;background:#FEF2F2;border-radius:0 6px 6px 0;padding:12px"><div class="lbl" style="color:#DC2626">Danger</div><span class="hx">#DF2E2E / #DC2626 / #FEF2F2</span></div>
<div style="flex:1;border-left:4px solid #2563EB;background:#EFF6FF;border-radius:0 6px 6px 0;padding:12px"><div class="lbl" style="color:#2563EB">Info</div><span class="hx">#2563EB / #EFF6FF</span></div>
</div></body></html>
